[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nlaid"
version = "0.1.0"
description = "Dinamica no local de una carga puntual con regularizacion point-splitting (Polonyi, arXiv:1701.04068)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["nlaid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: tests de convergencia, lentos"]
